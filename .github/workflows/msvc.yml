name: Windows x64

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: vcpkg-cache
          key: vcpkg-msvc-${{ hashFiles('.github/workflows/msvc.yml') }}
      - name: Install dependencies
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache
          vcpkg install --triplet x64-windows `
            zlib libjpeg-turbo pixman fltk nettle gtest "gettext[tools]"
      - name: Configure
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          $env:PATH = "$vcpkg\installed\x64-windows\bin;$env:PATH"
          cmake `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DENABLE_NLS=ON `
            -DENABLE_H264=ON `
            -DENABLE_AUDIO=ON `
            -DENABLE_GNUTLS=OFF `
            -DENABLE_NETTLE=ON `
            -DBUILD_VIEWER=ON `
            -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        continue-on-error: true
        working-directory: build
        run: |
          ctest --test-dir tests/unit/ -C Release `
            --output-junit test-results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-msvc
          path: build/tests/unit/test-results.xml

      # ---------------- 发布 ----------------
      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        run: choco install innosetup --no-progress -y

      - name: Package installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cmake --build build --config Release --target installer
        continue-on-error: true

      - name: Package portable zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          $stage = "TuPigVNC-win64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build\vncviewer\Release\vncviewer.exe $stage\
          Copy-Item "$vcpkg\installed\x64-windows\bin\*.dll" $stage\ -ErrorAction SilentlyContinue
          Copy-Item README.rst, LICENCE.TXT $stage\
          Copy-Item po\zh_CN.mo "$stage\zh_CN.mo" -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath "TuPigVNC-win64-${{ github.ref_name }}.zip" -Force

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: TuPigVNC-win64
          path: |
            build/*.exe
            TuPigVNC-win64-*.zip
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.exe
            TuPigVNC-win64-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false

  report-windows-msvc:
    name: Unit tests (Windows, MSVC)
    runs-on: ubuntu-latest
    needs: build-windows-msvc
    if: always()
    steps:
      - uses: dorny/test-reporter@v3
        with:
          artifact: test-results-windows-msvc
          name: FIXME not used, but required
          path: '*.xml'
          reporter: java-junit
