name: Windows x64

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        with:
          path: vcpkg-cache
          key: vcpkg-msvc-${{ hashFiles('.github/workflows/msvc.yml') }}
      - name: Install dependencies
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache
          vcpkg install --triplet x64-windows-static `
            zlib libjpeg-turbo pixman fltk nettle gtest "gettext[tools]"
      - name: Configure
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          $env:PATH = "$vcpkg\installed\x64-windows-static\bin;$env:PATH"
          cmake `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DENABLE_NLS=ON `
            -DENABLE_H264=ON `
            -DENABLE_AUDIO=ON `
            -DENABLE_GNUTLS=OFF `
            -DENABLE_NETTLE=ON `
            -DBUILD_VIEWER=ON `
            -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        continue-on-error: true
        working-directory: build
        run: |
          ctest --test-dir tests/unit/ -C Release `
            --output-junit test-results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-msvc
          path: build/tests/unit/test-results.xml

      # ---------------- 发布（仅生成安装包） ----------------
      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/')
        run: choco install innosetup --no-progress -y

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $env:PATH = "C:\Program Files (x86)\Inno Setup 6;$env:PATH"
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          $env:PATH = "$vcpkg\installed\x64-windows-static\bin;$env:PATH"
          cmake --build build --config Release --target installer

      - name: Generate checksum
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          Get-ChildItem build\release\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ASCII -NoNewline "$($_.FullName).sha256"
            Write-Host "$($_.Name): $hash"
          }

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/*.exe
            build/release/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false

  report-windows-msvc:
    name: Unit tests (Windows, MSVC)
    runs-on: ubuntu-latest
    needs: build-windows-msvc
    if: always()
    steps:
      - uses: dorny/test-reporter@v3
        with:
          artifact: test-results-windows-msvc
          name: FIXME not used, but required
          path: '*.xml'
          reporter: java-junit
