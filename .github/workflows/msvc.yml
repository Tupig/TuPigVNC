name: Windows x64

# 每次推送到 main 自动构建；构建成功后自动递增补丁版本并发布 Release。
# 版本提交使用 [skip ci]，避免重复触发。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支串行执行，避免版本号竞争
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      # 显式固定 vcpkg 安装根目录。runner 自带的是 C:\vcpkg，
      # 但它是 runner 自动设的环境变量，不能出现在 ${{ env.* }} 上下文里，
      # 所以这里显式声明，供 cache 步骤的 path 引用。
      VCPKG_INSTALLATION_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/tmp/vcpkg/binary-cache
      # 依赖集合（vcpkg install 列表）或缓存布局变化时手动递增，用于让缓存失效
      VCPKG_CACHE_VERSION: v2
      # sccache 使用 GitHub Actions 缓存后端，无需额外对象存储
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next version
        id: version
        shell: pwsh
        # 提交信息通过环境变量传入，绝不直接内插进脚本。
        # 直接内插会让提交信息里的引号 / $() 破坏脚本，构成脚本注入漏洞。
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          $isMain = $env:GITHUB_REF -eq "refs/heads/main"
          $skip = $env:COMMIT_MSG -match '\[skip ci\]'
          $content = Get-Content CMakeLists.txt -Raw
          if ($content -match 'set\(VERSION ([\d.]+)\)') {
            $current = $matches[1]
          } else {
            throw "无法从 CMakeLists.txt 读取版本号"
          }
          if ($isMain -and -not $skip) {
            $parts = $current.Split('.')
            while ($parts.Count -lt 3) { $parts += '0' }
            $parts[2] = [int]$parts[2] + 1
            $next = $parts -join '.'
            "release=true" >> $env:GITHUB_OUTPUT
          } else {
            $next = $current
            "release=false" >> $env:GITHUB_OUTPUT
          }
          "current=$current" >> $env:GITHUB_OUTPUT
          "next=$next" >> $env:GITHUB_OUTPUT
          Write-Host "当前版本: $current, 构建版本: $next"

      - name: Bump version in tree
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          $content = Get-Content CMakeLists.txt -Raw
          $content = $content -replace 'set\(VERSION [\d.]+\)', "set(VERSION ${{ steps.version.outputs.next }})"
          Set-Content CMakeLists.txt $content -NoNewline

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          # 同时缓存 vcpkg 的二进制包目录与已安装的库。
          # 只缓存 vcpkg-cache 时，vcpkg 仍会逐包重算 ABI 并解压全部依赖；
          # 缓存 installed 后，命中时 vcpkg install 直接判定已安装，几秒完成。
          # downloads 缓存源码压缩包，避免联网重复下载。
          path: |
            tmp/vcpkg/binary-cache
            ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
            ${{ env.VCPKG_INSTALLATION_ROOT }}/downloads
          # 依赖集合变化时才递增 VCPKG_CACHE_VERSION。
          # 不要用 hashFiles('msvc.yml')：那样每次调整工作流都会让缓存失效，
          # 白白多花二十多分钟重装依赖。
          key: vcpkg-msvc-${{ env.VCPKG_CACHE_VERSION }}-${{ runner.os }}

      - name: Install dependencies
        run: |
          New-Item -ItemType Directory -Force tmp/vcpkg/binary-cache
          vcpkg install --triplet x64-windows-static `
            zlib libjpeg-turbo pixman fltk nettle gtest "gettext[tools]"

      # 依赖装完立即保存缓存：actions/cache 的 post 默认 success()，
      # 后续编译失败时不会保存，导致每次重装五十分钟依赖。
      - name: Save vcpkg cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            tmp/vcpkg/binary-cache
            ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
            ${{ env.VCPKG_INSTALLATION_ROOT }}/downloads
          key: vcpkg-msvc-${{ env.VCPKG_CACHE_VERSION }}-${{ runner.os }}

      # 编译缓存：跨 run 复用 .obj，全量编译从三十分钟降到几分钟。
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.8.1"

      - name: Configure
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          $env:PATH = "$vcpkg\installed\x64-windows-static\bin;$env:PATH"
          cmake `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DENABLE_NLS=ON `
            -DENABLE_H264=ON `
            -DENABLE_AUDIO=ON `
            -DENABLE_GNUTLS=OFF `
            -DENABLE_NETTLE=ON `
            -DBUILD_VIEWER=ON `
            -S . -B tmp/build/ci-native

      - name: Build
        run: cmake --build tmp/build/ci-native --config Release

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100'

      - name: Publish WPF frontend
        shell: pwsh
        run: |
          dotnet publish src/ui/TuPigVNC.Wpf/TuPigVNC.Wpf.csproj `
            -c Release -p:Platform=x64 --self-contained true `
            "-p:TupigVncBuildDir=$env:GITHUB_WORKSPACE/tmp/build/ci-native" `
            -o tmp/build/ci-native/publish
          if ($LASTEXITCODE -ne 0) { throw "WPF publish failed" }
          foreach ($name in @('TuPigVNC.exe', 'TuPigVNC.dll', 'TuPigVNC.Core.dll')) {
            if (-not (Test-Path "tmp/build/ci-native/publish/$name")) { throw "Missing artifact: $name" }
          }

      - name: Upload WPF verification build
        uses: actions/upload-artifact@v7
        with:
          name: TuPigVNC-wpf-verification-x64
          path: tmp/build/ci-native/publish/
          if-no-files-found: error

      - name: Test
        working-directory: tmp/build/ci-native
        run: |
          ctest --test-dir tests/unit/ -C Release `
            --output-junit test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-msvc
          path: tmp/build/ci-native/tests/unit/test-results.xml

      # ---------------- 打包（仅 main 发布构建） ----------------
      # Inno Setup 7.1.1 x64 安装包已入库（tool/packaging/innosetup），
      # 避免 CI 每次联网下载；SHA-256 校验防止文件被篡改。
      # 注意：Chocolatey 上的 innosetup 包只到 6.3.x，而
      # SetupArchitecture=x64（生成 64 位 PE 安装器）是 Inno Setup 7 才有的指令。
      - name: Install Inno Setup
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE "tool\packaging\innosetup\innosetup-7.1.1-x64.exe"
          $expected = "8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0"
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "Inno Setup 安装包校验失败（期望 $expected，实际 $actual）"
          }
          Start-Process -FilePath $installer -Wait -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-"
          foreach ($dir in @("C:\Program Files\Inno Setup 7",
                             "C:\Program Files (x86)\Inno Setup 7")) {
            if (Test-Path (Join-Path $dir "ISCC.exe")) {
              Write-Host "找到 ISCC: $dir\ISCC.exe"
            }
          }

      - name: Build installer
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\Inno Setup 7;C:\Program Files (x86)\Inno Setup 7;$env:PATH"
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          $env:PATH = "$vcpkg\installed\x64-windows-static\bin;$env:PATH"
          cmake --build tmp/build/ci-native --config Release --target installer

      - name: Generate checksum
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          Get-ChildItem tmp\build\ci-native\release\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ASCII -NoNewline "$($_.FullName).sha256"
            Write-Host "$($_.Name): $hash"
          }

      # ---------------- 自动发版 ----------------
      - name: Commit version bump and tag
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "chore: 自动发布 v${{ steps.version.outputs.next }} [skip ci]"
          git tag -a "v${{ steps.version.outputs.next }}" -m "TuPigVNC v${{ steps.version.outputs.next }}"
          git push origin main
          git push origin "v${{ steps.version.outputs.next }}"

      - name: Create Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.next }}
          name: TuPigVNC v${{ steps.version.outputs.next }}
          files: |
            tmp/build/ci-native/release/*.exe
            tmp/build/ci-native/release/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false

  report-windows-msvc:
    name: Unit tests (Windows, MSVC)
    runs-on: ubuntu-latest
    needs: build-windows-msvc
    if: always()
    steps:
      - uses: dorny/test-reporter@v3
        with:
          artifact: test-results-windows-msvc
          name: 单元测试
          path: '*.xml'
          reporter: java-junit
          # 构建失败时不会产生测试结果，此时不应让报告 job 额外报错
          fail-on-empty: false

  # ---------------- 安全扫描（构建通过后执行） ----------------
  # 合并进本工作流而非独立文件：CodeQL 需要编译期插桩，独立运行会
  # 重复安装 vcpkg 依赖并重复编译，白白多花一倍时间。此处通过
  # needs 建立前后关系，并复用同一份 vcpkg 缓存。
  codeql-analyze:
    name: 安全扫描 (CodeQL)
    runs-on: windows-latest
    needs: build-windows-msvc
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      VCPKG_INSTALLATION_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/tmp/vcpkg/binary-cache
      VCPKG_CACHE_VERSION: v2
    steps:
      - uses: actions/checkout@v6

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v6
        with:
          path: |
            tmp/vcpkg/binary-cache
            ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
            ${{ env.VCPKG_INSTALLATION_ROOT }}/downloads
          key: vcpkg-msvc-${{ env.VCPKG_CACHE_VERSION }}-${{ runner.os }}

      - name: Install dependencies
        run: |
          New-Item -ItemType Directory -Force tmp/vcpkg/binary-cache
          vcpkg install --triplet x64-windows-static `
            zlib libjpeg-turbo pixman fltk nettle gtest "gettext[tools]"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          $env:PATH = "$vcpkg\installed\x64-windows-static\bin;$env:PATH"
          cmake `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DENABLE_NLS=ON `
            -DENABLE_H264=ON `
            -DENABLE_AUDIO=ON `
            -DENABLE_GNUTLS=OFF `
            -DENABLE_NETTLE=ON `
            -DBUILD_VIEWER=ON `
            -S . -B tmp/build/ci-native

      - name: Build
        run: cmake --build tmp/build/ci-native --config Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
